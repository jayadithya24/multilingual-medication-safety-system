services:
  - type: web
    name: mmss-api-jayadithya24
    runtime: python
    branch: dev
    buildCommand: pip install -r requirements.txt
    startCommand: python tools/start_production.py
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.13.4
      - key: HOST
        value: 0.0.0.0
      - key: ENVIRONMENT
        value: production
      - key: MONGO_DB
        value: meds
      - key: MONGO_URI
        sync: false
      - key: NEO4J_URI
        sync: false
      - key: NEO4J_USER
        sync: false
      - key: NEO4J_PASSWORD
        sync: false
      - key: BROWSER_ORIGINS
        value: https://mmss-dun.vercel.app
      - key: FORWARDED_ALLOW_IPS
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: FIREBASE_SERVICE_ACCOUNT_JSON
        sync: false
      - key: WARM_UP_OCR
        value: "false"
      - key: ENABLE_RESEARCH_ML_API
        value: "false"
